name: Deploy Public Dashboard

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/api/package-lock.json
            packages/core/package-lock.json
            packages/dashboard/package-lock.json
            packages/runner/package-lock.json

      - name: Install API dependencies
        working-directory: packages/api
        run: npm ci

      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci

      - name: Install dashboard dependencies
        working-directory: packages/dashboard
        run: npm ci

      - name: Install runner dependencies
        working-directory: packages/runner
        run: npm ci

      - name: Run tests
        run: npm test

  generate-release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: ./.github/actions/generate-release-notes
        with:
          config: cliff.toml
          output-file: RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: packages/dashboard
        run: npm ci

      - name: Build public dashboard
        working-directory: packages/dashboard
        env:
          VITE_PUBLIC_MODE: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/dashboard/dist-public

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
