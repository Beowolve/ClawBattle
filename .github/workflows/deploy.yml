name: Deploy Public Dashboard

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: |
            packages/api/package-lock.json
            packages/core/package-lock.json
            packages/dashboard/package-lock.json

      - name: Check npm dependency release age
        run: node scripts/check-npm-release-age.js

      - name: Install API dependencies
        working-directory: packages/api
        run: npm ci --ignore-scripts

      - name: Install core dependencies
        working-directory: packages/core
        run: npm ci --ignore-scripts

      - name: Install dashboard dependencies
        working-directory: packages/dashboard
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build dashboard
        working-directory: packages/dashboard
        run: npm run build

  generate-release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: ./.github/actions/generate-release-notes
        with:
          config: cliff.toml
          output-file: RELEASE_NOTES.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi

  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: packages/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: packages/dashboard
        run: npm ci --ignore-scripts

      - name: Build public dashboard
        working-directory: packages/dashboard
        env:
          VITE_PUBLIC_MODE: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:public

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/dashboard/dist-public

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
